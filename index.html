<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>pomotion</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="pomotion" />

    <script>
      // Evita el flash de tema incorrecto antes de que React monte: aplica
      // la preferencia guardada (o la del sistema) apenas carga el HTML.
      (function () {
        try {
          var stored = localStorage.getItem('pomotion:theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;

          var accents = ['tomato', 'amber', 'green', 'teal', 'blue', 'indigo', 'pink', 'graphite'];
          var accent = localStorage.getItem('pomotion:accent');
          var isCustom = accent === 'custom';
          document.documentElement.dataset.accent = isCustom
            ? 'custom'
            : (accents.indexOf(accent) >= 0 ? accent : 'tomato');

          if (isCustom) {
            // Mismo color que aplicaría useAccent.ts en React — evita el
            // flash del acento default antes de que monte.
            var customColor = localStorage.getItem('pomotion:accent-custom-color');
            if (/^#[0-9a-fA-F]{6}$/.test(customColor || '')) {
              var r = parseInt(customColor.slice(1, 3), 16);
              var g = parseInt(customColor.slice(3, 5), 16);
              var b = parseInt(customColor.slice(5, 7), 16);
              var yiq = (r * 299 + g * 587 + b * 114) / 1000;
              document.documentElement.style.setProperty('--color-accent', customColor);
              document.documentElement.style.setProperty(
                '--color-accent-contrast',
                yiq >= 128 ? '#000000' : '#ffffff'
              );
            }
          }
        } catch (e) {
          // localStorage no disponible — se queda con el tema/acento por defecto.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
